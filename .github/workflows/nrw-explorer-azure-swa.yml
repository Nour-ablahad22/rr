# Deployment von NRW Explorer auf Azure Static Web Apps (Frontend + Azure Functions unter /api).
# Voraussetzung: Repository-Secret AZURE_STATIC_WEB_APPS_API_TOKEN (Deployment-Token der Static Web App)
# sowie optional VITE_GOOGLE_MAPS_API_KEY / VITE_GOOGLE_MAPS_MAP_ID als Secrets bzw. Variablen.
name: NRW Explorer – Azure Static Web Apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['nrw-explorer/**', '.github/workflows/nrw-explorer-azure-swa.yml']

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Frontend prüfen und bauen
        working-directory: nrw-explorer
        env:
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAPS_MAP_ID: ${{ vars.VITE_GOOGLE_MAPS_MAP_ID }}
          VITE_DATA_SOURCE: api
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
        run: |
          npm ci
          npm run lint:data
          npm run build
      - name: API bauen und testen
        working-directory: nrw-explorer/api
        run: |
          npm ci
          npm test
      - name: Hinweis bei fehlendem Token
        if: env.SWA_TOKEN == ''
        run: echo "::warning::AZURE_STATIC_WEB_APPS_API_TOKEN ist nicht gesetzt – Deployment wird übersprungen."
      - name: Deploy
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: nrw-explorer/dist
          api_location: nrw-explorer/api
          skip_app_build: true
          skip_api_build: true
